services:
  healsync-backend:
    container_name: healsync-backend
    env_file:
      - .env
    build:
      context: .
      dockerfile: ./Dockerfile
    expose:
      - '${SERVICE_PORT}'
    ports:
      - '${HOST_PORT}:${SERVICE_PORT}'
    networks:
      healsync:
        aliases:
          - healsync-backend
